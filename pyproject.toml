[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "math-reasoning-posttraining-lab"
version = "0.1.0"
description = "A reproducible smoke lab for verifier-based SFT, DPO and GRPO objectives"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]

[tool.setuptools]
py-modules = ["verifier", "losses", "metrics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
